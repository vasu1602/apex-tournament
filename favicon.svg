<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="50%" stop-color="#090d15" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Neon Crimson to Cyan Gradient -->
    <linearGradient id="neonApex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744" />
      <stop offset="50%" stop-color="#ff5252" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>

    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744" />
      <stop offset="100%" stop-color="#ff5252" />
    </linearGradient>

    <!-- Continuous Clockwise Rotation Keyframes -->
    <style>
      @keyframes spinClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      .anim-corners {
        transform-origin: 60px 60px;
        animation: spinClockwise 8s linear infinite;
      }
      .anim-inner-core {
        transform-origin: 60px 60px;
        animation: spinClockwise 4s linear infinite;
      }
      .anim-pulse {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Outer Rounded Shield Base -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- 1. ROTATING OUTER CORNERS & TELEMETRY RING (Clockwise) -->
  <g class="anim-corners">
    <!-- Outer Dashed Circular Orbit -->
    <circle cx="60" cy="60" r="50" fill="none" stroke="url(#neonApex)" stroke-width="2.5" stroke-dasharray="14 10 24 10" stroke-linecap="round" />
    
    <!-- 4 High-Tech Rotating Corner Orbit Marks -->
    <!-- Top Notch -->
    <polygon points="60,6 64,14 56,14" fill="#00e5ff" />
    <!-- Bottom Notch -->
    <polygon points="60,114 64,106 56,106" fill="#ff1744" />
    <!-- Right Notch -->
    <polygon points="114,60 106,64 106,56" fill="#00e5ff" />
    <!-- Left Notch -->
    <polygon points="6,60 14,64 14,56" fill="#ff1744" />

    <!-- Corner Chevrons -->
    <path d="M22,22 L30,16 L30,28 Z" fill="#ff1744" opacity="0.85" />
    <path d="M98,22 L90,16 L90,28 Z" fill="#00e5ff" opacity="0.85" />
    <path d="M98,98 L90,104 L90,92 Z" fill="#00e5ff" opacity="0.85" />
    <path d="M22,98 L30,104 L30,92 Z" fill="#ff1744" opacity="0.85" />
  </g>

  <!-- 2. ROTATING INNER LOGO CORE (Clockwise) -->
  <g class="anim-inner-core">
    <!-- Inner High-Velocity Speed Turbine Blades / Apex Wings -->
    <path d="M60,20 L40,78 L52,78 L58,58 L62,58 L60,20 Z" fill="url(#crimsonGrad)" />
    <path d="M60,20 L80,78 L68,78 L62,58 L58,58 L60,20 Z" fill="url(#cyanGrad)" />
    <path d="M60,100 L40,42 L52,42 L58,62 L62,62 L60,100 Z" fill="url(#cyanGrad)" opacity="0.75" />
    <path d="M60,100 L80,42 L68,42 L62,62 L58,62 L60,100 Z" fill="url(#crimsonGrad)" opacity="0.75" />

    <!-- Center Cross Turbine Core -->
    <circle cx="60" cy="60" r="14" fill="#060910" stroke="url(#neonApex)" stroke-width="2.5" />
    <polygon points="60,50 63,57 70,60 63,63 60,70 57,63 50,60 57,57" fill="#ffffff" />
  </g>

  <!-- Center Static Glowing Core Spark -->
  <circle cx="60" cy="60" r="4" fill="#00e5ff" />
</svg>
