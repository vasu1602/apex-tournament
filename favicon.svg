<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="50%" stop-color="#090d15" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Crimson to Cyan Neon Racing Gradient -->
    <linearGradient id="neonApex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744" />
      <stop offset="50%" stop-color="#ff5252" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Cyan Turbo Gradient -->
    <linearGradient id="cyanTurbo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b0ff" />
      <stop offset="100%" stop-color="#18ffff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="url(#neonApex)" stroke-width="3.5" />

  <!-- Aerodynamic Circuit Track Curves (Subtle background) -->
  <path d="M16,92 Q60,104 104,92" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3" />
  <path d="M22,28 Q60,18 98,28" fill="none" stroke="rgba(0,229,255,0.12)" stroke-width="2" />

  <!-- Left Dynamic Apex Wing ("A" left blade) -->
  <path d="M60,18 L32,82 L46,82 L55,60 L65,60 L60,18 Z" fill="url(#neonApex)" filter="url(#neonGlow)" />

  <!-- Right Hypercar Aerodynamic Strike ("V" right wing) -->
  <path d="M60,18 L88,82 L74,82 L65,60 L55,60 L60,18 Z" fill="url(#cyanTurbo)" filter="url(#neonGlow)" />

  <!-- Inner High-Velocity Speed Wedge -->
  <polygon points="60,26 50,70 70,70" fill="#070b12" />

  <!-- Center Glowing Turbo Spark / Apex Needle -->
  <polygon points="60,28 64,54 60,62 56,54" fill="#ffffff" />

  <!-- Bottom Aerodynamic Splitter / Grand Prix Chevrons -->
  <polygon points="40,88 60,98 80,88 74,84 60,91 46,84" fill="url(#neonApex)" />
</svg>
